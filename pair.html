<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Connect your wedgie</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { background: #fff; }
      @media (prefers-color-scheme: dark) { body { background: #151515; } }
      #wallet { width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <!-- the same frame as the side panel (same extension page origin, same wallet), so the port picked here is the panel's too -->
    <iframe id="wallet" allow="publickey-credentials-get *; publickey-credentials-create *; serial *; camera *; clipboard-read *; clipboard-write *"></iframe>
    <script src="pair.js"></script>
  </body>
</html>
